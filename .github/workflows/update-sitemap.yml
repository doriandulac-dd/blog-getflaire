name: Update sitemap

on:
  schedule:
    # GitHub Actions planifie les tâches en UTC. Exécution chaque heure à :17.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap from Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SITEMAP_STRICT: 'true'
        run: npm run blog-sitemap

      - name: Validate sitemap
        run: npm run sitemap:validate -- --local-only

      - name: Commit sitemap when it changed
        run: |
          if git diff --quiet -- 'public/sitemap*.xml'; then
            echo "Sitemap already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'public/sitemap*.xml'
          git commit -m "chore: update sitemap"
          git push
